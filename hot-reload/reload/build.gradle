plugins {
	id 'java-library'
	id 'maven-publish'
}

// 재로딩 엔진 라이브러리. 소비자 애플리케이션이 의존성으로 추가하면 auto-configuration으로 동작한다.

java {
	withSourcesJar()
}

configurations {
	actuatorScenario
}

dependencies {
	def bom = platform(rootProject.ext.springBootBom)

	implementation bom
	implementation 'org.springframework:spring-webmvc'
	implementation 'org.springframework.boot:spring-boot'
	implementation 'org.springframework.boot:spring-boot-autoconfigure'

	// 런타임에는 소비자 애플리케이션(spring-boot-starter-web)이 제공한다.
	compileOnly bom
	compileOnly 'jakarta.servlet:jakarta.servlet-api'
	compileOnly 'jakarta.annotation:jakarta.annotation-api'
	compileOnly 'com.fasterxml.jackson.core:jackson-databind'
	// 자식 트랜잭션 인프라(ChildInfrastructureConfiguration). 없으면 조건에 걸려 건너뛴다.
	compileOnly 'org.springframework:spring-tx'

	annotationProcessor bom
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	testImplementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// AOP 누수 테스트: 부모 aspect, 트랜잭션 advisor
	testImplementation 'org.springframework.boot:spring-boot-starter-aop'
	testImplementation 'org.springframework:spring-tx'
	// 일반 웹 애플리케이션 시나리오 테스트(*ScenarioTest). 보안 auto-configuration은
	// src/test/resources/application.properties에서 기본으로 꺼 두고, 보안 시나리오만 다시 켠다.
	testImplementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation'
	testImplementation 'io.micrometer:micrometer-core'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// ActuatorScenarioTest가 별도 클래스로더로 올리는 jar. actuator를 테스트 클래스패스에 두면 모든 테스트
	// 애플리케이션에 actuator가 켜지고, 현재 엔진에서는 부모 context가 뜨지 못한다.
	actuatorScenario bom
	actuatorScenario 'org.springframework.boot:spring-boot-starter-actuator'
}

tasks.withType(Test).configureEach {
	def actuatorJars = configurations.actuatorScenario.minus(configurations.testRuntimeClasspath)
	inputs.files(actuatorJars).withPropertyName('actuatorScenarioJars')
	jvmArgumentProviders.add({ ['-Dactuator.scenario.classpath=' + actuatorJars.asPath] } as CommandLineArgumentProvider)
}

// @KnownIssue(태그 known-issue): 일반 Spring Boot 앱이라면 통과해야 하지만 현재 엔진에서는 실패하는 시나리오.
// 기본 test에서는 빼고, knownIssueTest로 따로 돌린다(실패가 정상).
tasks.named('test', Test) {
	useJUnitPlatform {
		excludeTags 'known-issue'
	}
}

tasks.register('knownIssueTest', Test) {
	description = 'Runs scenarios that are known to fail with the current reload engine (@KnownIssue).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'known-issue'
	}
}

publishing {
	publications {
		reload(MavenPublication) {
			artifactId = 'reload'
			from components.java
		}
	}
}
